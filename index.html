<!DOCTYPE html>

    <head>
        <!-- Page Title. -->
        <title> HC's Portfolio - Home </title>
        
        <!-- CSS Style Sheet for external CSS. -->

        <!-- Import font: 'Kreon'. -->
        <link

        />

            rel="preconnect"

        />
        <link
            href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&display=swap"

        <!-- Import font: 'Font Awesome' for social media icons. -->

                <a id="twitter" href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
