<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <!-- Page Title. -->
        <title> HC Acting - Home </title>
        
        <!-- CSS Style Sheet for external CSS. -->
        <link href="style.css" rel="stylesheet">

        <!-- Import font: 'Permanent Marker'. -->
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
            rel="stylesheet"
        />

        <!-- Import font: 'Font Awesome' for social media icons. -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    </head>

    <!-- Body section. -->
    <body>

        <!-- Header section.
         Use only for the navigation bar and nested elements. -->
        <header>
            <a href="index.html">
                <div class="logo-container">
                    <img
                        src="images/index/logo.png"
                        alt="The logo of aspiring actor, artist, and musician Holly Clark."
                        title="Holly Clark - Actor"
                    />
                </div>
            </a>

            <!-- Container for the tagline in the navigation bar. -->
            <div class="tagline-container">
                <!-- A shortquote with formatting tags for emphasis & styling. -->
                <em><q><strong>Born</strong> for the <ins>spotlight</ins>!</q></em>
            </div>

            <!-- Navigation for the top of each page. -->
            <nav class="navigation">
                <ul class="nav-ul">
                    <li><a href="#" id="pages"> ABOUT </a></li>
                    <li><a href="#" id="pages"> SKILLS </a></li>
                    <li><a href="#" id="pages"> PROJECTS </a></li>
                    <li><a href="#" id="pages"> CONTACT </a></li> <!-- Contact link placed last as per typical user experience. -->
                </ul>

                <!-- Container for the social media links in the navigation bar. -->
                <div class="nav-socials">
                    <a id="twitter" href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                    <a id="facebook" href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                    <a id="instagram" href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </nav>
        </header>

        <main>
            <!-- Background container for the main content area. -->
            <div class="bg-container">
                <!-- Header box for the main content area. -->
                <div class="header-box">
                    <!-- The specific container for the header text;
                     used to apply styling to the width of the content (see .header-container h1). -->
                    <div class="header-container">
                        <h1>
                            <!-- Header text for the main content area.
                             <span> element used to apply a separate colour to part of the text. -->
                            <span style="color: white;">
                                That's me;
                            </span>
                            <br>
                            that's <ins>Holly!</ins>
                        </h1>
                    </div>
                </div>

                <!-- A container to allow the neat arrangement of buttons below the paragraph box. -->
                <div class="under-header-box">
                    <!-- Paragraph box for the text and 'Read More' button. -->
                    <div class="paragraph-box">
                        <h2>
                            Lorem Ipsum
                        </h2>

                        <p>
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                        </p>

                        <!-- 'Read More' button. -->
                        <button class="read-more">
                            <a href="#" target="_blank">
                                READ MORE...
                            </a>
                        </button>
                    </div>

                    <!-- A container for the portfolio and services buttons. -->
                    <div class="under-header-buttons-box">
                        <!-- 'Portfolio' button. -->
                        <button class="portfolio-button">
                            <a href="#" target="_blank">
                                PORTFOLIO
                            </a>
                        </button>

                        <!-- 'Services' button. -->
                        <button class="services-button">
                            <a href="#" target="_blank">
                                SERVICES
                            </a>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer>

        </footer>
    </body>
</html>
